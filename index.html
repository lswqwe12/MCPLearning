<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="MCP（Model Context Protocol）全面知识学习网站 —— 从入门到进阶的 MCP 协议学习平台"
    />
    <title>MCP Learning Hub · MCP 全面知识学习网站</title>
    <script>
      // 在首屏渲染前应用主题，避免闪烁（FOUC）
      (function () {
        try {
          var stored = localStorage.getItem('mcp-learning-hub:theme');
          var dark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* noop */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
